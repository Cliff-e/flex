name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:libs && pnpm --filter "./artifacts/api-server" --filter "./scripts" --if-present run typecheck

      - name: Build API server (mirrors DigitalOcean App Platform build)
        run: pnpm --filter @workspace/api-server run build
